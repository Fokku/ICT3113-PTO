# ---------------------------------------------------------------------------
# ICT3113 Assignment 1 — JMeter properties for every load, mixed and stress run
# Owner: Part 1 — Yeo Kai Yuan (test harness)
#
# Pass this file to JMeter with -q so that nobody has to remember the flags:
#
#   $JMETER_HOME/bin/jmeter -n -t jmeter/load_post_tickets.jmx \
#       -l results/runs/<run>/results.jtl -j results/runs/<run>/jmeter.log \
#       -q jmeter/user.properties -Jhost=... -Jport=8000 ...
#
# -q properties are loaded AFTER jmeter.properties and after JMeter's own
# bin/user.properties, so everything below wins over whatever is installed on
# the machine running the test. That matters: the .jtl column set is part of our
# evidence chain, and it must not depend on a teammate's local JMeter install.
#
# Everything here is either (a) required by analysis/ to be able to read the
# .jtl at all, or (b) a JMeter default written out explicitly so that the value
# is visible and auditable. Where a line restates a default, the comment says so.
# Nothing here tunes the system under test; see the HARD RULES in the repo README.
# ---------------------------------------------------------------------------


# ---------------------------------------------------------------------------
# 1. Sample variables — the request_id / source_row reconciliation mechanism
# ---------------------------------------------------------------------------
# Each sampler's User Parameters pre-processor sets these two JMeter variables
# per iteration, and the HTTP Header Manager sends them as X-Request-ID and
# X-Source-Row. The service echoes both into its JSONL log line. Naming them
# here makes JMeter append two extra columns, "request_id" and "source_row", to
# the end of every CSV .jtl row, which is what lets analysis/reconcile.py join
# a JMeter sample to the service log line it caused. Without this line the .jtl
# and the service log cannot be joined at all and no number is traceable.
#
# The order matters: analysis/tests/conftest.py builds fixture .jtl files with
# request_id before source_row. Do not reorder and do not add a third variable
# without updating JTL_COLUMNS there.
sample_variables=request_id,source_row


# ---------------------------------------------------------------------------
# 2. Result file format — CSV, with the exact column set analysis/ expects
# ---------------------------------------------------------------------------
# analysis/common.py:read_jtl() reads the .jtl with pandas and requires
# timeStamp, elapsed, label, responseCode and success. It parses timeStamp with
# unit="ms", so the timestamp format below MUST stay as epoch milliseconds.
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.print_field_names=true
jmeter.save.saveservice.default_delimiter=,
jmeter.save.saveservice.timestamp_format=ms

# Fields saved. Every line below is JMeter 5.6's own default, restated so that
# the header line is pinned by this file rather than inherited. Together they
# produce exactly:
#   timeStamp,elapsed,label,responseCode,responseMessage,threadName,dataType,
#   success,failureMessage,bytes,sentBytes,grpThreads,allThreads,URL,Latency,
#   IdleTime,Connect,"request_id","source_row"
jmeter.save.saveservice.time=true
jmeter.save.saveservice.label=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_message=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.data_type=true
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.assertion_results_failure_message=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.sent_bytes=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.url=true
# Latency is time-to-first-byte and Connect is TCP connect time. Keeping both
# is how we tell "the service was slow" apart from "the network or the
# connection setup was slow" when we come to diagnose the bottleneck.
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.idle_time=true
jmeter.save.saveservice.subresults=true
jmeter.save.saveservice.assertions=true

# Fields NOT saved. Response bodies are the big one: a 300-second run at a few
# requests a second would otherwise write tens of megabytes of classification
# replies into the .jtl, and the reply is already in the service log with its
# request_id. Everything else here is off by default and is restated only so a
# reader can see that we thought about it.
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.response_data.on_error=false
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.encoding=false
jmeter.save.saveservice.filename=false
jmeter.save.saveservice.hostname=false
jmeter.save.saveservice.sample_count=false

# Assertion detail: "none" keeps the pass/fail flag and the failure message but
# not a per-assertion block. Default; restated because the failure message is
# how an unexpected non-200 is diagnosed after the fact.
jmeter.save.saveservice.assertion_results=none

# Buffered writes (the default). Flushing the .jtl on every sample would make
# the load generator do a disk write inside each measured interval, which is
# exactly the kind of load-generator overhead that turns latency numbers into
# fiction. JMeter flushes on a clean shutdown, so a completed run loses nothing.
jmeter.save.saveservice.autoflush=false


# ---------------------------------------------------------------------------
# 3. HTTP client behaviour on the load generator
# ---------------------------------------------------------------------------
# No client-side retries. A retried request would be sent twice, logged twice by
# the service and counted once by JMeter, which breaks reconciliation; worse, it
# would hide a real failure of the system under test behind a successful second
# attempt. An error must be reported as an error.
httpclient4.retrycount=0

# Keep-alive is left at JMeter's default (on, via each plan's "use_keepalive").
# This is a load-generator setting, not a tuning of the service: the service
# still opens a fresh httpx client and a fresh SQLite connection per request by
# design and we are not changing that. What we avoid is paying a TCP handshake
# inside every measured sample on the generator side.
#
# DNS: prefer passing -Jhost as an IP address, or add the service host to
# /etc/hosts on the load generator, so that name resolution never lands inside a
# measured sample. The JVM resolver cache is a java.security setting and cannot
# be set from this file. Record whichever you did in docs/environment/.


# ---------------------------------------------------------------------------
# 4. Console output
# ---------------------------------------------------------------------------
# The non-GUI summariser prints a running total to stdout. run_load_test.sh
# captures stdout to jmeter_stdout.txt in the run directory, so this is part of
# the kept evidence. 30 s is JMeter's default interval.
summariser.name=summary
summariser.interval=30
summariser.log=true
summariser.out=true

# Exit the JVM as soon as the test has ended and every listener has flushed.
# JMeter 5.6.3 on JDK 21 otherwise idles about 60 s after "end of run" before the
# process exits (seen in the 8 October 2026 rehearsal), which costs a minute per
# run and nothing else: span_s and every latency come from the .jtl itself.
jmeterengine.force.system.exit=true
