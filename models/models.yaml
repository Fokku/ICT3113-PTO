# ===========================================================================
# models/models.yaml -- the candidate model PIN FILE. Team 10, ICT3113 A1.
# ===========================================================================
#
# WHAT THIS FILE IS
#   The machine-readable half of models/candidates.md. Two kinds of field live
#   here and they must not be confused:
#
#     * HUMAN-WRITTEN fields (everything except the `pinned:` blocks) are edited
#       by a person, reviewed, and committed. scripts/pull_and_pin_models.sh
#       never touches them.
#     * PINNED fields (inside each `pinned:` block) are written ONLY by
#       scripts/pull_and_pin_models.sh, from what the Ollama host actually
#       reports after a pull. Do not type them in by hand: a digest you typed
#       is not evidence that anything was pulled.
#
# WHY THE DIGESTS MATTER
#   The digests in this file are what we report with our results on Slide 5.
#   They are the only thing tying a latency or accuracy number to a specific
#   set of weights. An Ollama tag is mutable: `llama3.2:3b` can be re-published
#   against different weights at any time, and `latest` tags move by design.
#
#   Therefore: A RE-PULL THAT CHANGES A DIGEST INVALIDATES EVERY EARLIER RUN
#   RECORDED UNDER THE OLD DIGEST. Those runs are not wrong, they are simply no
#   longer comparable with anything pulled afterwards, and they cannot be
#   pooled with new runs or reported in the same row of a results table.
#   scripts/pull_and_pin_models.sh therefore FAILS LOUDLY on a digest change
#   instead of quietly rewriting the pin; overriding it needs --allow-repin and
#   means re-running the affected benchmarks.
#
# HOW TO CHANGE THIS FILE
#   Adding or removing a candidate, or editing a rationale: edit by hand, and
#   keep models/candidates.md in step -- the slide is built from both.
#   Establishing or refreshing a pin: run the script. Never by hand.
#     scripts/pull_and_pin_models.sh --dry-run     # prints the plan only
#     scripts/pull_and_pin_models.sh               # pulls and pins
#     scripts/pull_and_pin_models.sh --model llama3.2:1b-instruct-q4_K_M
#
# STATUS: CONFIRMED 2026-10-02 (Yeo Kai Yuan, Part 1). The four candidates below
#   are the final shortlist; the decisions are recorded in the "Decision record"
#   at the top of models/candidates.md. The `pinned:` blocks are filled by
#   scripts/pull_and_pin_models.sh run against the service host's Ollama.
#
# FORMAT NOTE FOR ANYONE EDITING BY HAND
#   The script patches the four scalars inside each `pinned:` block in place, by
#   line, so that these comments survive. Keep each `pinned:` block exactly four
#   keys, one per line, at the indentation used below, and do not put trailing
#   comments on those four lines.
# ===========================================================================

# Schema version of THIS file's layout. Bump it if the shape changes, because
# scripts/pull_and_pin_models.sh checks it and refuses a shape it predates.
schema_version: 1

# Free-text provenance, for the marker and for us in six weeks' time.
source: >-
  Shortlist proposed 2026-09-23 and confirmed 2026-10-02 from ollama.com/library
  and the upstream model cards. Every factual claim about a model, and every licence, is cited in
  models/candidates.md. Sizes and digests here are written by
  scripts/pull_and_pin_models.sh, not by hand.

# ---------------------------------------------------------------------------
# The candidates, in the order they should appear on Slide 5: smallest first,
# so the size/speed trade-off reads left to right.
# ---------------------------------------------------------------------------
candidates:

  # -- Slot: floor of the trade-off (sub-2B) --------------------------------
  # DECIDED 2026-10-02: the explicit four-bit build, not the bare `llama3.2:1b`
  # tag (whose default build is Q8_0). Every candidate is now Q4_K_M, so the
  # Llama 1B/3B pair varies parameter count only. See "The Q8_0 problem" in
  # models/candidates.md.
  - tag: "llama3.2:1b-instruct-q4_K_M"
    name: "Meta Llama 3.2 1B Instruct"
    size_class: "sub-2B"
    parameters: "1.24B"
    default_quantisation: "Q4_K_M"
    expected_download: "808 MB"
    licence: "Llama 3.2 Community License (custom, not OSI-approved)"
    licence_url: "https://github.com/meta-llama/llama-models/blob/main/models/llama3_2/LICENSE"
    url: "https://ollama.com/library/llama3.2:1b-instruct-q4_K_M"
    rationale: >-
      The fast end of the trade-off and the member most likely to fail the
      accuracy requirement. It is in the set to show how cheap the client can go
      before short-output instruction-following breaks down.
    # Written by scripts/pull_and_pin_models.sh. Never edit by hand.
    pinned:
      digest: "sha256:22bc6b92eb0160c4629782fca05a9032c59d306ab2058b7dacc8a4644fbafa02"
      pulled_at: "2026-10-02T11:56:37Z"
      size_bytes: 807709787
      ollama_version: "0.34.3"

  # -- Slot: middle of the trade-off, controlled within-family comparison ---
  - tag: "llama3.2:3b"
    name: "Meta Llama 3.2 3B Instruct"
    size_class: "3-4B"
    parameters: "3.21B"
    default_quantisation: "Q4_K_M"
    expected_download: "2.0 GB"
    licence: "Llama 3.2 Community License (custom, not OSI-approved)"
    licence_url: "https://github.com/meta-llama/llama-models/blob/main/models/llama3_2/LICENSE"
    url: "https://ollama.com/library/llama3.2:3b"
    rationale: >-
      Same family, tokeniser, chat template and licence as the 1B, one size
      class up and at the same Q4_K_M quantisation, so this pair isolates the
      effect of parameter count under a fixed prompt. This is the controlled comparison in the set.
    # Written by scripts/pull_and_pin_models.sh. Never edit by hand.
    pinned:
      digest: "sha256:a80c4f17acd55265feec403c7aef86be0c25983ab279d83f3bcd3abbcb5b8b72"
      pulled_at: "2026-10-02T11:57:31Z"
      size_bytes: 2019393189
      ollama_version: "0.34.3"

  # -- Slot: middle of the trade-off, licence-clean comparator --------------
  # This is the dense build. The granite4 *-h tags are the hybrid Mamba-2
  # builds, which IBM positions for cases where mamba-2 is optimised; the dense
  # build is the safer pin for a CPU-only measurement.
  - tag: "granite4:3b"
    name: "IBM Granite 4.0 Micro"
    size_class: "3-4B"
    parameters: "3.4B"
    default_quantisation: "Q4_K_M"
    expected_download: "2.1 GB"
    licence: "Apache License 2.0"
    licence_url: "https://www.apache.org/licenses/LICENSE-2.0"
    url: "https://ollama.com/library/granite4:3b"
    rationale: >-
      A permissively licensed alternative in the same size class as
      llama3.2:3b. It answers the client's commercial question directly: does
      choosing an Apache-2.0 model cost us anything measurable?
    # Written by scripts/pull_and_pin_models.sh. Never edit by hand.
    pinned:
      digest: "sha256:89962fcc75239ac434cdebceb6b7e0669397f92eaef9c487774b718bc36a3e5f"
      pulled_at: "2026-10-02T11:57:31Z"
      size_bytes: 2099521385
      ollama_version: "0.34.3"

  # -- Slot: ceiling of the trade-off (7-8B) --------------------------------
  # Apache-2.0 at THIS size. Note that qwen2.5:3b and qwen2.5:72b are NOT
  # Apache-2.0 -- they carry the non-commercial Qwen Research License. Do not
  # add another size from this family without re-checking its licence.
  - tag: "qwen2.5:7b"
    name: "Alibaba Qwen2.5 7B Instruct"
    size_class: "7-8B"
    parameters: "7.62B"
    default_quantisation: "Q4_K_M"
    expected_download: "4.7 GB"
    licence: "Apache License 2.0"
    licence_url: "https://www.apache.org/licenses/LICENSE-2.0"
    url: "https://ollama.com/library/qwen2.5:7b"
    rationale: >-
      The largest model that is honestly servable on commodity CPU, and the only
      candidate expected to be slow enough to matter. It is instruction-tuned
      with no thinking mode to disable, so it tests capability rather than our
      prompt.
    # Written by scripts/pull_and_pin_models.sh. Never edit by hand.
    pinned:
      digest: "sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e"
      pulled_at: "2026-10-02T11:57:31Z"
      size_bytes: 4683087332
      ollama_version: "0.34.3"

# ---------------------------------------------------------------------------
